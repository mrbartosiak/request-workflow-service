              "action": {"const": "delete"},
              "state": {"const": "CREATED"},
              "context": {
                "type": "object",
                "additionalProperties": false,
                "required": ["name"],
                "properties": {"name": {"$ref": "#/components/schemas/Name"}}
              },
              "expectedRevision": {"$ref": "#/components/schemas/Observation"}
            }
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": ["ref", "action", "state", "context", "expectedRevision"],
            "properties": {
              "ref": {"$ref": "#/components/schemas/Reference"},
              "action": {"const": "publish"},
              "state": {"const": "ACCEPTED"},
              "context": {
                "type": "object",
                "additionalProperties": false,
                "required": ["name"],
                "properties": {"name": {"$ref": "#/components/schemas/Name"}}
              },
              "expectedRevision": {"$ref": "#/components/schemas/Observation"}
            }
          }
        ]
      },
      "BrowseItem": {
        "type": "object",
        "additionalProperties": false,
        "required": ["ref"],
        "properties": {
          "ref": {"$ref": "#/components/schemas/Reference"},
          "type": {"$ref": "#/components/schemas/RequestType"},
          "name": {"$ref": "#/components/schemas/Name"},
          "state": {"$ref": "#/components/schemas/RequestState"},
          "publicationId": {"$ref": "#/components/schemas/DecimalString"}
        },
        "allOf": [{"$ref": "#/components/schemas/ReadProjectionMasks"}]
      },
      "BrowsePage": {
        "type": "object",
        "additionalProperties": false,
        "required": ["items"],
        "properties": {
          "items": {"type": "array", "maxItems": 50, "items": {"$ref": "#/components/schemas/BrowseItem"}},
          "nextCursor": {"$ref": "#/components/schemas/Cursor"}
        }
      },
      "RequestHistory": {
        "type": "object",
        "additionalProperties": false,
        "required": ["ref", "changes"],
        "properties": {
          "ref": {"$ref": "#/components/schemas/Reference"},
          "changes": {
            "type": "array",
            "minItems": 1,
            "maxItems": 4,
            "items": {"$ref": "#/components/schemas/HistoryChange"}
          }
        }
      },
      "HistoryChange": {
        "type": "object",
        "additionalProperties": false,
        "required": ["sequence", "action", "from", "to"],
        "properties": {
          "sequence": {"type": "integer", "minimum": 1, "maximum": 4},
          "action": {
            "type": "string",
            "enum": ["create", "verify", "accept", "reject", "delete", "publish"]
          },
          "from": {
            "oneOf": [{"$ref": "#/components/schemas/RequestState"}, {"type": "null"}]
          },
          "to": {"$ref": "#/components/schemas/RequestState"}
        },
        "allOf": [
          {
            "if": {
              "properties": {"action": {"const": "create"}}
            },
            "then": {
              "properties": {"sequence": {"const": 1}, "from": {"type": "null"}, "to": {"const": "CREATED"}}
            },
            "else": {
              "properties": {"sequence": {"minimum": 2}, "from": {"$ref": "#/components/schemas/RequestState"}}
            }
          }
        ]
      },
      "Problem": {
        "type": "object",
        "additionalProperties": false,
        "required": ["type", "title", "status", "instance", "correlationId"],
        "properties": {
          "type": {"type": "string", "format": "uri", "pattern": "^urn:requests:problem:[a-z_]+$"},
          "title": {"type": "string"},
          "status": {"type": "integer", "minimum": 400, "maximum": 599},
          "instance": {
            "type": "string",
            "format": "uri",
            "pattern": "^urn:uuid:[0-9a-f-]{36}$",
            "description": "The URN carries the same generated UUID as correlationId."
          },
          "correlationId": {"type": "string", "format": "uuid"},
          "invalidFields": {
            "type": "array",
            "minItems": 1,
            "maxItems": 1,
            "items": {
              "type": "string",
              "enum": [
                "type",
                "name",
                "body",
                "reason",
                "expectedRevision",
                "Idempotency-Key",
                "ref",
                "action",
                "state",
                "size",
                "cursor"
              ]
            }
          }
        }
      }
    }
  }
}
