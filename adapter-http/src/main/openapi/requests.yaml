          {
            "if": {
              "required": ["state"],
              "properties": {"state": {"const": "DELETED"}}
            },
            "then": {"properties": {"name": false, "body": false, "revision": false}}
          }
        ]
      },
      "RequestView": {
        "type": "object",
        "additionalProperties": false,
        "required": ["ref"],
        "properties": {
          "ref": {"$ref": "#/components/schemas/Reference"},
          "type": {"$ref": "#/components/schemas/RequestType"},
          "name": {"$ref": "#/components/schemas/Name"},
