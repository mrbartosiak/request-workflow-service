{
  "openapi": "3.1.0",
  "info": {
    "title": "Request Workflow Service",
    "version": "0.1.0",
    "description": "Unversioned HTTP paths. Success JSON uses UTF-8. Requests carrying JSON accept application/json with no charset or UTF-8 and one compatible content encoding. All responses use Cache-Control no-store. JSON input has exact object members and rejects duplicate names and type coercion. Query parameters are single-valued, exact and route-specific. Decoded text is preserved exactly. Empty and Unicode White_Space-only values, U+0000, invalid UTF-8 and unpaired surrogates are rejected. Authority and action-specific field permissions apply to every release. Absolute wire byte bounds are defined by x-utf8MaxBytes and enforced after decoding. Opaque sample tokens are placeholders for values issued by the matching route."
  },
  "security": [
    {
      "BearerAuth": []
    }
  ],
  "paths": {
    "/operation-keys": {
      "post": {
        "operationId": "issueOperationKey",
        "summary": "Issue an operation key",
        "description": "Requires KEY_ISSUE. Send an empty body and no query parameters. The response has no request effect. The key is signed, expiring and scoped to the caller.",
        "responses": {
          "201": {
            "description": "Signed key issued",
            "headers": {"Cache-Control": {"$ref": "#/components/headers/NoStore"}},
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/IssuedKey"},
                "examples": {
                  "issued": {"value": {"key": "opaque-signed-key", "expiresAt": "2026-11-23T10:00:00Z"}}
                }
              }
            }
          },
          "400": {"$ref": "#/components/responses/InvalidInput"},
          "401": {"$ref": "#/components/responses/AuthenticationRequired"},
          "403": {"$ref": "#/components/responses/ActionDenied"},
          "406": {"$ref": "#/components/responses/NotAcceptable"},
          "500": {"$ref": "#/components/responses/InternalError"},
          "503": {"$ref": "#/components/responses/AuthorityUnavailable"}
        }
      }
    },
    "/requests": {
      "post": {
        "operationId": "createRequest",
        "summary": "Create a request",
        "description": "Choose an explicit type. Name and body are preserved exactly. Authorized exact replay uses the original status, result and Location.",
        "parameters": [
          {"$ref": "#/components/parameters/OperationKey"},
          {"$ref": "#/components/parameters/ContentEncoding"}
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {"$ref": "#/components/schemas/CreateInput"},
              "examples": {
                "input": {"value": {"type": "HR_TICKET", "name": "  Zażółć gęślą  ", "body": "  Treść العربية 😀  "}}
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Created or authorized exact replay",
            "headers": {
              "Cache-Control": {"$ref": "#/components/headers/NoStore"},
              "Location": {"$ref": "#/components/headers/CreateLocation"}
            },
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/CreateResult"},
                "examples": {
                  "created": {
                    "value": {
                      "ref": "ABc123_45-aBc123ABc123_45-aBc123",
                      "action": "create",
                      "resultRevision": "1",
                      "state": "CREATED"
                    }
                  }
                }
              }
            }
          },
          "400": {"$ref": "#/components/responses/InvalidInput"},
          "401": {"$ref": "#/components/responses/AuthenticationRequired"},
          "404": {"$ref": "#/components/responses/NotFound"},
          "406": {"$ref": "#/components/responses/NotAcceptable"},
          "409": {"$ref": "#/components/responses/CreateConflict"},
          "413": {"$ref": "#/components/responses/RequestTooLarge"},
          "415": {"$ref": "#/components/responses/UnsupportedMedia"},
          "500": {"$ref": "#/components/responses/InternalError"},
          "503": {"$ref": "#/components/responses/MutationUnavailable"}
        }
      },
      "get": {
        "operationId": "browseRequests",
        "summary": "Browse authorized requests",
        "description": "Send an empty body. Names compare case-sensitive exact UTF-8. Supplied filters combine with AND. Pages traverse live authorized membership by descending creation epoch, ordinal and reference. A continuation is present only when the guarded lookahead found another currently visible match.",
        "parameters": [
          {
            "name": "name",
            "in": "query",
            "required": false,
            "description": "Exact decoded name.",
            "schema": {"$ref": "#/components/schemas/Name"}
          },
          {
            "name": "state",
            "in": "query",
            "required": false,
            "description": "Exact current lifecycle state.",
            "schema": {"$ref": "#/components/schemas/RequestState"}
          },
          {
            "name": "size",
            "in": "query",
            "required": false,
            "description": "ASCII decimal integer from 1 through 50. Leading zeros are accepted. Defaults to 10.",
            "schema": {"type": "string", "pattern": "^0*(?:[1-9]|[1-4][0-9]|50)$", "default": "10"}
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "description": "Opaque encrypted cursor. Repeat equal effective filters and size. Invalid, expired or mismatched cursors require a fresh browse.",
            "schema": {"$ref": "#/components/schemas/Cursor"}
          }
        ],
        "responses": {
          "200": {
            "description": "An authorized page",
            "headers": {"Cache-Control": {"$ref": "#/components/headers/NoStore"}},
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/BrowsePage"},
                "examples": {
                  "published": {
                    "value": {
                      "items": [
                        {
                          "ref": "publish-ref",
                          "type": "HR_TICKET",
                          "name": "  Zażółć gęślą  ",
                          "state": "PUBLISHED",
                          "publicationId": "9223372036854775807"
                        }
                      ]
                    }
                  },
                  "empty": {
                    "value": {
                      "items": []
                    }
                  },
                  "deleted": {"value": {"items": [{"ref": "delete-ref", "state": "DELETED"}]}},
                  "publicationWithoutState": {
                    "value": {
                      "items": [{"ref": "publish-ref", "publicationId": "9223372036854775807"}],
                      "nextCursor": "opaque-cursor"
                    }
                  },
                  "maskedContinuation": {
                    "value": {
                      "items": [{"ref": "publish-ref"}],
                      "nextCursor": "opaque-cursor"
                    }
                  }
                }
              }
            }
          },
          "400": {"$ref": "#/components/responses/InvalidInput"},
          "401": {"$ref": "#/components/responses/AuthenticationRequired"},
          "406": {"$ref": "#/components/responses/NotAcceptable"},
          "500": {"$ref": "#/components/responses/InternalError"},
          "503": {"$ref": "#/components/responses/AuthorityUnavailable"}
        }
      }
    },
    "/requests/{ref}": {
      "parameters": [{"$ref": "#/components/parameters/Reference"}],
      "get": {
        "operationId": "getRequest",
        "summary": "Read request detail",
        "description": "Send an empty body and no query parameters. Only currently permitted fields appear. Fields withheld by access or retention are omitted. Deleted metadata omits revision. A disclosable Publish with unresolved proof defers.",
        "responses": {
          "200": {
            "description": "Current shape for the caller's field grants",
            "headers": {"Cache-Control": {"$ref": "#/components/headers/NoStore"}},
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/RequestView"},
                "examples": {
                  "published": {
                    "value": {
                      "ref": "publish-ref",
                      "type": "HR_TICKET",
                      "name": "  Zażółć gęślą  ",
                      "state": "PUBLISHED",
                      "publicationId": "9223372036854775807",
                      "body": "  Treść العربية 😀  ",
                      "revision": "9007199254740993"
                    }
                  },
                  "masked": {"value": {"ref": "publish-ref"}},
                  "publicationWithoutState": {
                    "value": {"ref": "publish-ref", "publicationId": "9223372036854775807"}
                  },
                  "deleted": {"value": {"ref": "delete-ref", "state": "DELETED"}}
                }
              }
            }
          },
          "400": {"$ref": "#/components/responses/InvalidInput"},
          "401": {"$ref": "#/components/responses/AuthenticationRequired"},
          "404": {"$ref": "#/components/responses/NotFound"},
          "406": {"$ref": "#/components/responses/NotAcceptable"},
          "500": {"$ref": "#/components/responses/InternalError"},
          "503": {"$ref": "#/components/responses/AuthorityUnavailable"}
        }
      }
    },
    "/requests/{ref}/action-context": {
      "parameters": [{"$ref": "#/components/parameters/Reference"}],
      "get": {
        "operationId": "getActionContext",
        "summary": "Read context for an action",
        "description": "Send an empty body and one action. The action-specific material field and opaque observation require current permission and eligibility. Only this route issues an observation for a new intent.",
        "parameters": [
          {
            "name": "action",
            "in": "query",
            "required": true,
            "description": "One action for which the caller needs an observation.",
            "schema": {"$ref": "#/components/schemas/ContextAction"}
          }
        ],
        "responses": {
          "200": {
            "description": "Current permitted decision context",
            "headers": {"Cache-Control": {"$ref": "#/components/headers/NoStore"}},
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/ActionContext"},
                "examples": {
                  "edit": {
                    "value": {
                      "ref": "edit-ref",
                      "action": "edit",
                      "state": "CREATED",
                      "context": {"body": "  Treść العربية 😀  "},
                      "expectedRevision": "opaque-observation"
                    }
                  },
                  "verify": {
                    "value": {
                      "ref": "edit-ref",
                      "action": "verify",
                      "state": "CREATED",
                      "context": {"body": "  Treść العربية 😀  "},
                      "expectedRevision": "opaque-observation"
                    }
                  },
                  "accept": {
                    "value": {
                      "ref": "verify-ref",
                      "action": "accept",
                      "state": "VERIFIED",
                      "context": {"body": "  Treść العربية 😀  "},
                      "expectedRevision": "opaque-observation"
                    }
                  },
                  "reject": {
                    "value": {
                      "ref": "verify-ref",
                      "action": "reject",
                      "state": "VERIFIED",
                      "context": {"name": "  Zażółć gęślą  "},
                      "expectedRevision": "opaque-observation"
                    }
                  },
                  "delete": {
                    "value": {
                      "ref": "edit-ref",
                      "action": "delete",
                      "state": "CREATED",
                      "context": {"name": "  Zażółć gęślą  "},
                      "expectedRevision": "opaque-observation"
                    }
                  },
                  "publish": {
                    "value": {
                      "ref": "accept-ref",
                      "action": "publish",
                      "state": "ACCEPTED",
                      "context": {"name": "  Zażółć gęślą  "},
                      "expectedRevision": "opaque-observation"
                    }
                  }
                }
              }
            }
          },
          "400": {"$ref": "#/components/responses/InvalidInput"},
          "401": {"$ref": "#/components/responses/AuthenticationRequired"},
          "403": {"$ref": "#/components/responses/ActionDenied"},
          "404": {"$ref": "#/components/responses/NotFound"},
          "406": {"$ref": "#/components/responses/NotAcceptable"},
          "409": {"$ref": "#/components/responses/IllegalState"},
          "500": {"$ref": "#/components/responses/InternalError"},
          "503": {"$ref": "#/components/responses/AuthorityUnavailable"}
        }
      }
    },
