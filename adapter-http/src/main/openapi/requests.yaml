    "schemas": {
      "RequestType": {
        "type": "string",
        "enum": ["HR_TICKET", "BUG_REPORT", "INTERNAL_REQUEST"]
      },
      "RequestState": {
        "type": "string",
        "enum": ["CREATED", "VERIFIED", "ACCEPTED", "REJECTED", "DELETED", "PUBLISHED"]
      },
      "ContextAction": {
        "type": "string",
        "enum": ["edit", "verify", "accept", "reject", "delete", "publish"]
      },
      "Reference": {
        "type": "string",
        "minLength": 1,
        "x-utf8MaxBytes": 128,
        "description": "Opaque reference with a decoded UTF-8 byte limit."
      },
      "Name": {
        "type": "string",
        "minLength": 1,
        "x-utf8MaxBytes": 256,
        "description": "Request name or exact browse name filter."
      },
      "Body": {"type": "string", "minLength": 1, "x-utf8MaxBytes": 16384, "description": "Request body text."},
      "Reason": {
        "type": "string",
        "minLength": 1,
        "x-utf8MaxBytes": 2048,
        "description": "A required reason for Reject or Delete."
      },
      "SignedKey": {
        "type": "string",
        "minLength": 1,
        "x-utf8MaxBytes": 1024,
        "description": "Opaque signed key from operation-key issuance. Do not parse or alter it.",
        "pattern": "^[^,]+$"
      },
      "Observation": {
        "type": "string",
        "minLength": 1,
        "x-utf8MaxBytes": 2048,
        "description": "Opaque observation from matching action context. Display revisions are decimal strings and fail this input.",
        "not": {"pattern": "^[0-9]+$"}
      },
      "Cursor": {
        "type": "string",
        "minLength": 1,
        "x-utf8MaxBytes": 2048,
        "description": "Opaque encrypted ASCII cursor.",
        "pattern": "^[\\u0001-\\u007f]+$"
      },
      "DecimalString": {
        "type": "string",
        "pattern": "^[1-9][0-9]{0,18}$",
        "x-decimalMaximum": "9223372036854775807",
        "description": "Canonical positive base-10 signed-64-bit value through 9223372036854775807. JSON type is string."
      },
      "CreateInput": {
        "type": "object",
        "additionalProperties": false,
        "required": ["type", "name", "body"],
        "properties": {
          "type": {"$ref": "#/components/schemas/RequestType"},
          "name": {"$ref": "#/components/schemas/Name"},
          "body": {"$ref": "#/components/schemas/Body"}
        }
      },
      "EditInput": {
        "type": "object",
        "additionalProperties": false,
        "required": ["body", "expectedRevision"],
        "properties": {
          "body": {"$ref": "#/components/schemas/Body"},
          "expectedRevision": {"$ref": "#/components/schemas/Observation"}
